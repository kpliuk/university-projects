apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: zkt26-z2
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: zkt26-z2
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: zkt26-z2
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
